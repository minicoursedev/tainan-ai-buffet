name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - public/puma_oshen_wave/stores.json
      - public/puma_oshen_wave/designer.json
      - public/puma_oshen_wave/assets/store-avatars/*.png
      - public/puma_oshen_wave/data/stores/tw_*_store.json
      - scripts/store-avatar-sync-state.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm run check

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
