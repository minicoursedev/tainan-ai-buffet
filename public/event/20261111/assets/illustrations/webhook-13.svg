<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img"><title>Webhook 是什麼：AI 程式把進度訊息送到 Discord 提供的專用網址，訊息出現在指定頻道</title><defs><marker id="green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#56704f" stroke-width="1.4"/></marker><marker id="gold" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ac823a" stroke-width="1.4"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif"><text x="600" y="42" text-anchor="middle" fill="#293e30" font-size="34" font-weight="650">一有進度，就把訊息送到指定網址</text><ellipse cx="150" cy="255" rx="130" ry="133" fill="#dce3cf" opacity=".48"/><ellipse cx="143" cy="263" rx="125" ry="136" fill="#e5e4cc" opacity=".28"/><ellipse cx="600" cy="255" rx="182" ry="150" fill="#dce3cf" opacity=".48"/><ellipse cx="593" cy="263" rx="177" ry="153" fill="#e5e4cc" opacity=".28"/><ellipse cx="1050" cy="255" rx="130" ry="133" fill="#dce3cf" opacity=".48"/><ellipse cx="1043" cy="263" rx="125" ry="136" fill="#e5e4cc" opacity=".28"/><g transform="translate(24 385) scale(1)" fill="none" stroke="#ac823a" stroke-width="1.3" opacity=".7"><path d="M0 75 Q24 36 19 0 M13 44 Q-10 32 -4 15 Q17 17 13 44 M20 25 Q37 20 40 1 Q19 2 20 25"/></g><g transform="translate(1145 80) scale(1)" fill="none" stroke="#ac823a" stroke-width="1.3" opacity=".7"><path d="M0 75 Q24 36 19 0 M13 44 Q-10 32 -4 15 Q17 17 13 44 M20 25 Q37 20 40 1 Q19 2 20 25"/></g><text x="150" y="217" text-anchor="middle" fill="#293e30" font-size="34" font-weight="650">AI 程式</text><text x="150" y="261" text-anchor="middle" fill="#69745e" font-size="23" font-weight="500">任務有了新進度</text><text x="150" y="307" text-anchor="middle" fill="#56704f" font-size="25" font-weight="600">「報告已完成」</text><text x="600" y="158" text-anchor="middle" fill="#56704f" font-size="44" font-weight="650">Webhook</text><text x="600" y="204" text-anchor="middle" fill="#293e30" font-size="27" font-weight="600">接收通知的專用網址</text><rect x="415" y="233" width="370" height="59" rx="14" fill="#f8f5ed" stroke="#ac823a" stroke-width="2"/><text x="600" y="271" text-anchor="middle" fill="#69745e" font-size="25" font-weight="500">https://…/webhooks/…</text><text x="600" y="337" text-anchor="middle" fill="#56704f" font-size="25" font-weight="600">傳入內容 → 指定頻道</text><path d="M290 256 L399 256" fill="none" stroke="#56704f" stroke-width="3" stroke-linecap="round" marker-end="url(#green)"/><text x="342" y="223" text-anchor="middle" fill="#56704f" font-size="22" font-weight="500">送出</text><path d="M800 256 L910 256" fill="none" stroke="#56704f" stroke-width="3" stroke-linecap="round" marker-end="url(#green)"/><text x="855" y="223" text-anchor="middle" fill="#56704f" font-size="22" font-weight="500">顯示</text><g transform="translate(1024 145) scale(2.2)" fill="#5865f2"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.15