<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img"><title>以 AI 系統為觀察點：送出回報、接收平台推送、主動查詢與輪詢</title><defs><marker id="green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#56704f" stroke-width="1.4"/></marker><marker id="gold" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ac823a" stroke-width="1.4"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif"><ellipse cx="125" cy="275" rx="98" ry="135" fill="#dce3cf" opacity=".48"/><ellipse cx="118" cy="283" rx="93" ry="138" fill="#e5e4cc" opacity=".28"/><ellipse cx="1075" cy="275" rx="98" ry="135" fill="#dce3cf" opacity=".48"/><ellipse cx="1068" cy="283" rx="93" ry="138" fill="#e5e4cc" opacity=".28"/><g transform="translate(30 365) scale(1)" fill="none" stroke="#ac823a" stroke-width="1.3" opacity=".7"><path d="M0 75 Q24 36 19 0 M13 44 Q-10 32 -4 15 Q17 17 13 44 M20 25 Q37 20 40 1 Q19 2 20 25"/></g><g transform="translate(1130 105) scale(1)" fill="none" stroke="#ac823a" stroke-width="1.3" opacity=".7"><path d="M0 75 Q24 36 19 0 M13 44 Q-10 32 -4 15 Q17 17 13 44 M20 25 Q37 20 40 1 Q19 2 20 25"/></g><text x="125" y="250" text-anchor="middle" fill="#293e30" font-size="35" font-weight="650">AI 系統</text><text x="125" y="294" text-anchor="middle" fill="#69745e" font-size="23" font-weight="500">任務與回報</text><text x="1075" y="250" text-anchor="middle" fill="#293e30" font-size="35" font-weight="650">即時通</text><text x="1075" y="294" text-anchor="middle" fill="#69745e" font-size="23" font-weight="500">使用者與團隊</text><g fill="none" stroke="#bdc6af" stroke-width="2"><path d="M220 275 H260 M260 100 V455 M940 100 V455 M940 275 H980"/></g><text x="600" y="65" text-anchor="middle" fill="#56704f" font-size="32" font-weight="650">送出回報</text><text x="600" y="102" text-anchor="middle" fill="#69745e" font-size="25" font-weight="500">AI 主動送出 · API／Webhook</text><path d="M265 132 L935 132" fill="none" stroke="#56704f" stroke-width="3" stroke-linecap="round" marker-end="url(#green)"/><text x="600" y="216" text-anchor="middle" fill="#ac823a" font-size="32" font-weight="650">接收回應：平台 Push</text><text x="600" y="254" text-anchor="middle" fill="#69745e" font-size="25" font-weight="500">平台主動送來 · Webhook／長連線事件</text><path d="M935 284 L265 284" fill="none" stroke="#ac823a" stroke-width="3" stroke-linecap="round" marker-end="url(#gold)"/><text x="600" y="365" text-anchor="middle" fill="#56704f" font-size="32" font-weight="650">主動取回：Pull</text><text x="600" y="401" text-anchor="middle" fill="#69745e" font-size="23" font-weight="500">AI 發出查詢</text><path d="M265 421 L935 421" fill="none" stroke="#56704f" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 9" marker-end="url(#green)"/><path d="M935 461 L265 461" fill="none" stroke="#ac823a" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 9" marker-end="url(#gold)"/><text x="600" y="498" text-anchor="middle" fill="#69745e" font-size="23" font-weight="500">平台回傳資料</text><text x="600" y="543" text-anchor="middle" fill="#293e30" font-size="26" font-weight="600">定時重複查詢，就是 Polling（輪詢）</text></g></svg>