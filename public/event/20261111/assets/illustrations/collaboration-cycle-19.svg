<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img"><title>自動化執行、AI參與、人為驗證、跟進處理，透過即時通回報並持續協作</title><defs><marker id="green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#56704f" stroke-width="1.4"/></marker><marker id="gold" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ac823a" stroke-width="1.4"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif"><text x="600" y="62" text-anchor="middle" fill="#69745e" font-size="30" font-weight="500">即時通，讓人與 AI 在同一個地方協作</text><text x="150" y="164" text-anchor="middle" fill="#ac823a" font-size="56" font-weight="300">01</text><path d="M50 196 H250" stroke="#bdc6af" stroke-width="1"/><text x="150" y="251" text-anchor="middle" fill="#293e30" font-size="33" font-weight="650">自動化執行</text><text x="150" y="300" text-anchor="middle" fill="#69745e" font-size="22" font-weight="500">流程啟動・執行任務</text><path d="M272 244 L327 244" fill="none" stroke="#56704f" stroke-width="3" stroke-linecap="round" marker-end="url(#green)"/><text x="450" y="164" text-anchor="middle" fill="#ac823a" font-size="56" font-weight="300">02</text><path d="M350 196 H550" stroke="#bdc6af" stroke-width="1"/><text x="450" y="251" text-anchor="middle" fill="#293e30" font-size="33" font-weight="650">AI 參與</text><text x="450" y="300" text-anchor="middle" fill="#69745e" font-size="22" font-weight="500">整理分析・產生成果</text><path d="M572 244 L627 244" fill="none" stroke="#56704f" stroke-width="3" stroke-linecap="round" marker-end="url(#green)"/><text x="750" y="164" text-anchor="middle" fill="#ac823a" font-size="56" font-weight="300">03</text><path d="M650 196 H850" stroke="#bdc6af" stroke-width="1"/><text x="750" y="251" text-anchor="middle" fill="#293e30" font-size="33" font-weight="650">人為驗證</text><text x="750" y="300" text-anchor="middle" fill="#69745e" font-size="22" font-weight="500">確認成果・提出修正</text><path d="M872 244 L927 244" fill="none" stroke="#56704f" stroke-width="3" stroke-linecap="round" marker-end="url(#green)"/><text x="1050" y="164" text-anchor="middle" fill="#ac823a" font-size="56" font-weight="300">04</text><path d="M950 196 H1150" stroke="#bdc6af" stroke-width="1"/><text x="1050" y="251" text-anchor="middle" fill="#293e30" font-size="33" font-weight="650">跟進處理</text><text x="1050" y="300" text-anchor="middle" fill="#69745e" font-size="22" font-weight="500">接續執行・回報結果</text><path d="M1050 340 V400 Q1050 420 1030 420 H170 Q150 420 150 400 V340" fill="none" stroke="#ac823a" stroke-width="2" marker-end="url(#gold)"/><rect x="400" y="398" width="400" height="44" fill="#f8f5ed"/><text x="600" y="429" text-anchor="middle" fill="#ac823a" font-size="27" font-weight="600">回報結果，展開下一輪</text><text x="600" y="521" text-anchor="middle" fill="#293e30" font-size="27" font-weight="600">交接・確認・追蹤，讓進度掌握在你手上</text></g></svg>