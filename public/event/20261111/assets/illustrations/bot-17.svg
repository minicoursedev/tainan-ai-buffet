<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img"><title>Bot 是由程式控制的帳號：團隊指令交給 Bot，Bot 呼叫 AI 或任務系統，再回覆處理結果</title><defs><marker id="green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#56704f" stroke-width="1.4"/></marker><marker id="gold" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ac823a" stroke-width="1.4"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif"><text x="600" y="42" text-anchor="middle" fill="#293e30" font-size="35" font-weight="650">Bot：由程式控制、能自動回應的帳號</text><ellipse cx="150" cy="260" rx="125" ry="130" fill="#dce3cf" opacity=".48"/><ellipse cx="143" cy="268" rx="120" ry="133" fill="#e5e4cc" opacity=".28"/><ellipse cx="600" cy="260" rx="130" ry="145" fill="#dce3cf" opacity=".48"/><ellipse cx="593" cy="268" rx="125" ry="148" fill="#e5e4cc" opacity=".28"/><ellipse cx="1050" cy="260" rx="125" ry="130" fill="#dce3cf" opacity=".48"/><ellipse cx="1043" cy="268" rx="120" ry="133" fill="#e5e4cc" opacity=".28"/><text x="150" y="233" text-anchor="middle" fill="#293e30" font-size="32" font-weight="650">團隊成員</text><text x="150" y="278" text-anchor="middle" fill="#69745e" font-size="25" font-weight="500">「目前進度？」</text><g fill="none" stroke="#56704f" stroke-width="4"><rect x="563" y="140" width="74" height="52" rx="12"/><path d="M600 140 V123 M578 180 H622"/><circle cx="581" cy="160" r="4"/><circle cx="619" cy="160" r="4"/></g><text x="600" y="244" text-anchor="middle" fill="#293e30" font-size="33" font-weight="650">Discord Bot</text><text x="600" y="284" text-anchor="middle" fill="#69745e" font-size="25" font-weight="500">接收指令・呼叫程式</text><text x="600" y="324" text-anchor="middle" fill="#69745e" font-size="25" font-weight="500">把結果回覆到頻道</text><text x="1050" y="233" text-anchor="middle" fill="#293e30" font-size="30" font-weight="650">AI／任務系統</text><text x="1050" y="278" text-anchor="middle" fill="#69745e" font-size="24" font-weight="500">查進度、執行工作</text><path d="M290 224 L450 224" fill="none" stroke="#56704f" stroke-width="3" stroke-linecap="round" marker-end="url(#green)"/><text x="370" y="198" text-anchor="middle" fill="#56704f" font-size="23" font-weight="500">提出指令</text><path d="M750 224 L910 224" fill="none" stroke="#56704f" stroke-width="3" stroke-linecap="round" marker-end="url(#green)"/><text x="830" y="198" text-anchor="middle" fill="#56704f" font-size="23" font-weight="500">交付處理</text><path d="M910 326 L750 326" fill="none" stroke="#ac823a" stroke-width="3" stroke-linecap="round" marker-end="url(#gold)"/><text x="830" y="365" text-anchor="middle" fill="#ac823a" font-size="23" font-weight="500">傳回結果</text><path d="M450 326 L290 326" fill="none" stroke="#ac823a" stroke-width="3" stroke-linecap="round" marker-end="url(#gold)"/><text x="370" y="365" text-anchor="middle" fill="#ac823a" font-size="23" font-weight="500">回覆訊息</text><text x="600" y="454" text-anchor="middle" fill="#293e30" font-size="26" font-weight="600">前面的 Webhook 用來送通知；Bot 讓團隊能發出指令、得到回覆</text><text x="600" y="502" text-anchor="middle" fill="#69745e" font-size="25" font-weight="500">Bot 不一定使用 AI；接上 AI，才具備相應的 AI 能力</text></g></svg>