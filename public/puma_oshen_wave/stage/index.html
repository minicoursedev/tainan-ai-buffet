<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>洋流舞台｜我們的洋流地圖</title>
<meta name="description" content="走進洋流舞台，點一座舞台，看一部影片。">
<meta name="theme-color" content="#f82970">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="canonical" href="https://minicourse.dev/puma_oshen_wave/stage/">
<meta property="og:title" content="洋流舞台｜我們的洋流地圖">
<meta property="og:description" content="走進洋流舞台，點一座舞台，看一部影片。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://minicourse.dev/puma_oshen_wave/stage/">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="../designer/css/market.css">
<link rel="stylesheet" href="./stage.css">
<script defer src="/assets/analytics.js?v=20261019-content-group"></script>
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="plaque" href="#/walk" aria-label="洋流舞台首頁">洋流舞台</a>
    <div class="modes" role="group" aria-label="舞台瀏覽方式">
      <button type="button" data-mode="walk" aria-pressed="true">逛舞台</button>
      <button type="button" data-mode="list" aria-pressed="false">影片列表</button>
      <button type="button" data-mode="map" aria-pressed="false">舞台地圖</button>
    </div>
    <nav class="stage-links" aria-label="洋流網站"><a class="link-btn" href="../designer/">洋流設計師</a><a class="link-btn" href="../">返回地圖</a></nav>
  </header>
  <main class="stage" id="stage-walk">
    <canvas id="walk-canvas" tabindex="0" aria-label="洋流舞台：按住拖著小人走，點舞台觀看影片"></canvas>
    <button type="button" class="where" id="btn-where"><b>洋流舞台</b><span id="where-aisle"></span><span class="where-switch">看地圖</span></button>
    <div class="status"><span class="tag" id="status-count" role="status">舞台準備中…</span></div>
    <p class="hint" id="hint"><span class="hint-desktop">按住拖著小人走，點舞台看影片。電腦也可以用方向鍵。</span><span class="hint-mobile">拖曳移動，點舞台看影片。</span></p>
    <p class="stage-message" id="stage-message" role="status" hidden></p>
    <div class="dock">
      <button type="button" class="btn btn-primary" id="btn-watch" disabled>靠近舞台看影片</button>
      <button type="button" class="btn" id="btn-next" disabled>下一座舞台</button>
      <button type="button" class="btn" id="btn-continuous" disabled>連續播放</button>
    </div>
  </main>
  <main class="list-mode" id="stage-list" hidden>
    <div class="stage-page"><h1>影片列表</h1>
      <label class="stage-search">找一部影片<input id="video-search" type="search" placeholder="搜尋影片、創作者" autocomplete="off"></label>
      <p id="list-count" role="status"></p><div class="video-grid" id="video-list"></div>
    </div>
  </main>
  <main class="map-mode" id="stage-map" hidden><div class="stage-page"><h1>舞台地圖</h1><p>選一座舞台，走過去看影片。</p><div id="stage-plan"></div></div></main>
  <footer class="app-footer"><small>© 2026 MiniCourse｜影片及相關內容權利歸原創作者或原權利人所有。</small></footer>
  <div class="toast" id="toast" role="status" popover="manual"></div>
</div>
<dialog id="video-dialog" class="dlg video-dialog" aria-labelledby="video-title">
  <div class="dlg-head"><h2 id="video-title"></h2><button type="button" class="dlg-close" aria-label="關閉影片">×</button></div>
  <div class="dlg-body">
    <p id="continuous-status" class="continuous-status" role="status" hidden></p>
    <div id="video-player" class="video-player"></div>
    <p id="video-creator"></p><p id="video-description"></p>
    <p class="muted" id="video-help" role="status"></p>
    <div class="video-actions"><a id="video-source" class="btn" target="_blank" rel="noopener noreferrer">到原網站觀看</a><button type="button" class="btn" id="copy-stage">複製舞台連結</button></div>
    <p id="share-status" class="muted" role="status"></p>
  </div>
</dialog>
<noscript><p class="stage-message">請啟用 JavaScript 瀏覽洋流舞台。<a href="https://www.youtube.com/watch?v=LnIlsGFRB_4">直接觀看《洋流漂過台北城》</a></p></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
